name: ATX Transform

on:
  workflow_dispatch:
    inputs:
      transform_name:
        description: Transform name to run
        required: true
        type: string
      build_command:
        description: Build command for the project
        required: false
        type: string
        default: ./gradlew build
      config_yaml:
        description: Additional ATX config (YAML string)
        required: false
        type: string
      java_source_version:
        description: Source Java version
        required: false
        type: string
        default: '8'
      java_target_version:
        description: Target Java version
        required: false
        type: string
        default: '17'

permissions:
  id-token: write
  contents: write
  pull-requests: write

jobs:
  atx-transform:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine transform assignment
        id: assignment
        env:
          REPO: ${{ github.repository }}
          ORG: ${{ github.repository_owner }}
          TRANSFORM_NAME: ${{ inputs.transform_name }}
          BUILD_COMMAND: ${{ inputs.build_command }}
        run: |
          if [ -n "$TRANSFORM_NAME" ]; then
            echo "transform_name=$TRANSFORM_NAME" >> "$GITHUB_OUTPUT"
            echo "build_command=$BUILD_COMMAND" >> "$GITHUB_OUTPUT"
            echo "transform_id=manual" >> "$GITHUB_OUTPUT"
            echo "mode=direct" >> "$GITHUB_OUTPUT"
            echo "org=$ORG" >> "$GITHUB_OUTPUT"
            echo "repo=$REPO" >> "$GITHUB_OUTPUT"
            echo "::notice::Using directly provided transform: $TRANSFORM_NAME"
            exit 0
          fi
          echo "::error::No transform_name input provided"
          exit 1

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.ATXCI_AWS_ROLE_ARN }}
          aws-region: us-east-1
          role-duration-seconds: 14400

      - name: Set up source Java
        if: inputs.java_source_version != ''
        uses: actions/setup-java@v4
        with:
          java-version: ${{ inputs.java_source_version }}
          distribution: temurin

      - name: Set up target Java
        if: inputs.java_target_version != ''
        uses: actions/setup-java@v4
        with:
          java-version: ${{ inputs.java_target_version }}
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Node.js for ATX CLI
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install ATX CLI
        env:
          ATX_CLI_INSTALLER_URL: https://transform-cli.awsstatic.com/install.sh
          ATX_CLI_INSTALLER_SHA256: ${{ vars.ATX_CLI_INSTALLER_SHA256 }}
        run: |
          set -euo pipefail
          if [ -z "${ATX_CLI_INSTALLER_SHA256}" ]; then
            echo "::error::Repository variable ATX_CLI_INSTALLER_SHA256 is not set; refusing to run an unverified installer"
            exit 1
          fi
          curl -fsSL --proto '=https' --tlsv1.2 -o install.sh "$ATX_CLI_INSTALLER_URL"
          echo "${ATX_CLI_INSTALLER_SHA256}  install.sh" > install.sh.sha256
          if ! sha256sum -c install.sh.sha256; then
            echo "::error::ATX CLI installer checksum verification failed"
            rm -f install.sh install.sh.sha256
            exit 1
          fi
          bash ./install.sh
          rm -f install.sh install.sh.sha256
          atx --version

      - name: Run ATX transform
        id: transform
        shell: bash
        env:
          TRANSFORM_NAME: ${{ steps.assignment.outputs.transform_name }}
          BUILD_CMD: ${{ steps.assignment.outputs.build_command }}
          CONFIG_YAML: ${{ inputs.config_yaml }}
        run: |
          BEFORE_SHA=$(git rev-parse HEAD)
          echo "::group::Running ATX transform: ${TRANSFORM_NAME}"
          atx_cmd=(atx custom def exec -n "$TRANSFORM_NAME" -p . -c "$BUILD_CMD" -x -t -d)
          if [ -n "$CONFIG_YAML" ]; then
            atx_cmd+=(-g "$CONFIG_YAML")
          fi
          set +e
          "${atx_cmd[@]}"
          EXIT_CODE=$?
          set -e
          echo "::endgroup::"
          echo "exit_code=${EXIT_CODE}" >> "$GITHUB_OUTPUT"
          if [ $EXIT_CODE -ne 0 ]; then
            echo "::error::ATX transform failed with exit code ${EXIT_CODE}"
          fi
          AFTER_SHA=$(git rev-parse HEAD)
          HAS_UNCOMMITTED=$(git status --porcelain)
          if [ "$BEFORE_SHA" != "$AFTER_SHA" ] || [ -n "$HAS_UNCOMMITTED" ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Transform produced changes"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Transform completed but produced no changes"
          fi

      - name: Generate GitHub App Token
        if: steps.transform.outputs.has_changes == 'true'
        uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ vars.ATXCI_APP_CLIENT_ID }}
          private-key: ${{ secrets.ATXCI_APP_PRIVATE_KEY }}

      - name: Create Pull Request
        if: steps.transform.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TRANSFORM_NAME: ${{ steps.assignment.outputs.transform_name }}
          BUILD_COMMAND: ${{ steps.assignment.outputs.build_command }}
          DEFAULT_BRANCH: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          SERVER_URL: ${{ github.server_url }}
          TRANSFORM_EXIT_CODE: ${{ steps.transform.outputs.exit_code }}
        run: |
          BRANCH_NAME="atx-transform/${TRANSFORM_NAME}"
          git config --unset-all http.https://github.com/.extraheader || true
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
          git push origin "HEAD:refs/heads/${BRANCH_NAME}" --force
          PR_BODY=$(printf '%s\n' \
            "## ATX Transform Applied" \
            "" \
            "**Transform**: \`${TRANSFORM_NAME}\`" \
            "**Build command**: \`${BUILD_COMMAND}\`" \
            "**Run ID**: [${RUN_ID}](${SERVER_URL}/${REPO}/actions/runs/${RUN_ID})" \
            "**Exit code**: \`${TRANSFORM_EXIT_CODE}\`" \
            "" \
            "---" \
            "_This PR was automatically created by [atxci](https://github.com/atxci)._" \
            "Please review the changes carefully before merging.")
          gh pr create \
            --base "${DEFAULT_BRANCH}" \
            --head "${BRANCH_NAME}" \
            --title "ATX Transform: ${TRANSFORM_NAME}" \
            --body "${PR_BODY}"
